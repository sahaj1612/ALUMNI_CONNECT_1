
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

body{
background:#f4f6f9;
font-family:Segoe UI;
}

/* Sidebar */

.sidebar{
position:fixed;
width:250px;
height:100vh;
background:#0d1b2a;
color:white;
padding-top:20px;
}

.sidebar h4{
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
padding:15px;
color:white;
text-decoration:none;
}

.sidebar a:hover{
background:#1b263b;
}

/* Topbar */

.topbar{
margin-left:250px;
background:#1b263b;
color:white;
padding:15px;
font-size:22px;
font-weight:bold;
}

/* Content */

.content{
margin-left:250px;
padding:30px;
}

/* Cards */

.card-box{
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-align:center;
}

.icon{
font-size:45px;
margin-bottom:15px;
}

</style>

</head>
<body>

<div class="sidebar">
<h4>Student Panel</h4>

<a href="#"><i class="fa fa-chart-line"></i> Dashboard</a>
<a href="#"><i class="fa fa-briefcase"></i> View Jobs</a>
<a href="#"><i class="fa fa-calendar"></i> View Events</a>
<a href="#"><i class="fa fa-file"></i> Applied Jobs</a>
<a href="#"><i class="fa fa-user"></i> Profile</a>
</div>

<div class="topbar">
COLLEGE ALUMNI SYSTEM
</div>

<div class="content">

<h3 class="mb-4">Dashboard</h3>

<div class="row">

<div class="col-md-4">
<div class="card-box">
<div class="icon text-primary">
<i class="fa fa-briefcase"></i>
</div>
<h2>10</h2>
<p>Available Jobs</p>
<button class="btn btn-primary">View Jobs</button>
</div>
</div>

<div class="col-md-4">
<div class="card-box">
<div class="icon text-success">
<i class="fa fa-calendar"></i>
</div>
<h2>6</h2>
<p>Upcoming Events</p>
<button class="btn btn-success">View Events</button>
</div>
</div>

<div class="col-md-4">
<div class="card-box">
<div class="icon text-danger">
<i class="fa fa-file"></i>
</div>
<h2>2</h2>
<p>Applied Jobs</p>
<button class="btn btn-danger">View Status</button>
</div>
</div>

</div>

</div>

</body>
</html>
```
