<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Profile</title>

<style>
    body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#f4f6f9;
}

.container{
    display:flex;
}

/* Sidebar */

.sidebar{
    width:220px;
    background:#0b1f33;
    color:white;
    height:100vh;
    padding:20px;
}

.sidebar h2{
    text-align:center;
}

.sidebar ul{
    list-style:none;
    padding:0;
}

.sidebar ul li{
    padding:12px;
    margin:8px 0;
    cursor:pointer;
}

.sidebar ul li:hover,
.sidebar ul .active{
    background:#133a5e;
    border-radius:5px;
}

/* Main */

.main{
    flex:1;
}

.navbar{
    background:#1e2d44;
    color:white;
    padding:15px;
}

.profile-container{
    padding:30px;
}

.profile-card{
    background:white;
    width:600px;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    display:flex;
    gap:30px;
}

.profile-img{
    width:150px;
    height:150px;
    border-radius:50%;
}

.profile-info p{
    font-size:18px;
    margin:8px 0;
}
</style>

</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Student Panel</h2>
        <ul>
            <li>Dashboard</li>
            <li>View Jobs</li>
            <li>View Events</li>
            <li>Applied Jobs</li>
            <li class="active">Profile</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main">

        <div class="navbar">
            <h1>COLLEGE ALUMNI SYSTEM</h1>
        </div>

        <div class="profile-container">

            <h2>My Profile</h2>

            <div class="profile-card">

                <img src="https://via.placeholder.com/150" class="profile-img">

                <div class="profile-info">
                    <p><strong>Name:</strong> Sahaj H</p>
                    <p><strong>Email:</strong> sahaj@gmail.com</p>
                    <p><strong>Phone:</strong> 9876543210</p>
                    <p><strong>Department:</strong> Computer Science</p>
                    <p><strong>Batch:</strong> 2022</p>
                    <p><strong>Skills:</strong> Java, Flutter, Web Development</p>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
