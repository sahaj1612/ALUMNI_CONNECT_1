<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alumni Events</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f6f9;
font-family:Segoe UI;
}

.topbar{
background:#1b263b;
color:white;
padding:15px;
font-size:22px;
font-weight:bold;
}

.container-box{
background:white;
padding:30px;
margin-top:30px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

</style>

</head>
<body>

<div class="topbar">
COLLEGE ALUMNI SYSTEM — Events
</div>

<div class="container mt-4">

<div class="container-box">

<h3 class="mb-4">Add New Event</h3>

<div class="row g-3">
<div class="col-md-3">
<input type="text" id="title" class="form-control" placeholder="Event Title">
</div>

<div class="col-md-3">
<input type="date" id="date" class="form-control">
</div>

<div class="col-md-3">
<input type="text" id="location" class="form-control" placeholder="Location">
</div>

<div class="col-md-3">
<button class="btn btn-success w-100" onclick="addEvent()">Add Event</button>
</div>
</div>

<hr>

<h3 class="mb-3">Events List</h3>

<table class="table table-bordered table-hover">
<thead class="table-dark">
<tr>
<th>#</th>
<th>Title</th>
<th>Date</th>
<th>Location</th>
<th>Action</th>
</tr>
</thead>

<tbody id="eventTable">
</tbody>

</table>

</div>

</div>

<script>

let count = 0;

function addEvent(){

let title = document.getElementById("title").value;
let date = document.getElementById("date").value;
let location = document.getElementById("location").value;

if(title=="" || date=="" || location==""){
alert("Please fill all fields");
return;
}

count++;

let table = document.getElementById("eventTable");

let row = table.insertRow();

row.innerHTML = `
<td>${count}</td>
<td>${title}</td>
<td>${date}</td>
<td>${location}</td>
<td><button class="btn btn-danger btn-sm" onclick="deleteEvent(this)">Delete</button></td>
`;

document.getElementById("title").value="";
document.getElementById("date").value="";
document.getElementById("location").value="";

}

function deleteEvent(btn){
btn.parentElement.parentElement.remove();
}

</script>

</body>
</html>
```
