<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alumni Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{
background:#f4f6f9;
font-family:Segoe UI;
}

/* Sidebar */
.sidebar{
position:fixed;
width:250px;
height:100vh;
background:#0d1b2a;
color:white;
padding-top:20px;
}

.sidebar h4{
text-align:center;
margin-bottom:25px;
}

.sidebar a{
display:block;
padding:14px;
color:white;
text-decoration:none;
cursor:pointer;
transition:.3s;
}

.sidebar a:hover{
background:#1b263b;
}

/* Topbar */
.topbar{
margin-left:250px;
background:#1b263b;
color:white;
padding:15px;
font-size:22px;
font-weight:bold;
}

/* Content */
.content{
margin-left:250px;
padding:30px;
}

.section{
display:none;
}

.active{
display:block;
}

.card-box{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-align:center;
}

.profile-card{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
<h4>Alumni Panel</h4>

<a onclick="showSection('dashboard')"><i class="fa fa-home"></i> Dashboard</a>
<a onclick="showSection('profile')"><i class="fa fa-user"></i> Profile</a>
<a onclick="showSection('postJob')"><i class="fa fa-briefcase"></i> Post Job</a>
<a onclick="showSection('events')"><i class="fa fa-calendar"></i> Create Event</a>
<a onclick="showSection('network')"><i class="fa fa-users"></i> Network</a>
<a onclick="showSection('donation')"><i class="fa fa-donate"></i> Donations</a>

</div>

<div class="topbar">
COLLEGE ALUMNI SYSTEM
</div>

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
<h3 class="mb-4">Dashboard</h3>

<div class="row">
<div class="col-md-3">
<div class="card-box">
<i class="fa fa-calendar fa-2x text-primary"></i>
<h2>5</h2>
<p>Total Events</p>
</div>
</div>

<div class="col-md-3">
<div class="card-box">
<i class="fa fa-briefcase fa-2x text-danger"></i>
<h2>3</h2>
<p>Jobs Posted</p>
</div>
</div>

<div class="col-md-3">
<div class="card-box">
<i class="fa fa-users fa-2x text-success"></i>
<h2>120</h2>
<p>Connections</p>
</div>
</div>

<div class="col-md-3">
<div class="card-box">
<i class="fa fa-donate fa-2x text-warning"></i>
<h2>₹25,000</h2>
<p>Total Donations</p>
</div>
</div>
</div>
</div>

<!-- PROFILE SECTION -->
<div id="profile" class="section">
<h3 class="mb-4">Alumni Profile</h3>

<div class="profile-card">

<div class="row">
<div class="col-md-4 text-center">
<img id="profilePic" src="https://via.placeholder.com/150"
class="rounded-circle mb-3" width="150">
<br>
<input type="file" class="form-control" onchange="changePhoto(event)">
</div>

<div class="col-md-8">
<div class="row g-3">

<div class="col-md-6">
<label>Name</label>
<input type="text" id="name" class="form-control">
</div>

<div class="col-md-6">
<label>Email</label>
<input type="email" id="email" class="form-control">
</div>

<div class="col-md-6">
<label>Batch</label>
<input type="text" id="batch" class="form-control">
</div>

<div class="col-md-6">
<label>Company</label>
<input type="text" id="companyProfile" class="form-control">
</div>

<div class="col-md-6">
<label>Role</label>
<input type="text" id="roleProfile" class="form-control">
</div>

<div class="col-md-6">
<label>Location</label>
<input type="text" id="locationProfile" class="form-control">
</div>

<div class="col-md-12">
<label>About</label>
<textarea id="about" class="form-control"></textarea>
</div>

<div class="col-md-12">
<button class="btn btn-success" onclick="saveProfile()">Save Profile</button>
</div>

</div>
</div>
</div>

</div>
</div>

<!-- Other sections SAME as before -->
<div id="postJob" class="section"><h3>Post Job Section</h3></div>
<div id="events" class="section"><h3>Event Section</h3></div>
<div id="network" class="section"><h3>Network Section</h3></div>
<div id="donation" class="section"><h3>Donation Section</h3></div>

</div>

<script>

function showSection(id){
document.querySelectorAll(".section").forEach(sec=>{
sec.classList.remove("active")
})
document.getElementById(id).classList.add("active")
}

function changePhoto(e){
let reader=new FileReader()
reader.onload=function(){
document.getElementById("profilePic").src=reader.result
}
reader.readAsDataURL(e.target.files[0])
}

function saveProfile(){
alert("Profile Saved Successfully")
}

</script>

</body>
</html>
