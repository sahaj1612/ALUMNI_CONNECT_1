<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alumni Connect Dashboard</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
    font-family:Segoe UI;
}

/* Sidebar */
.sidebar{
    height:100vh;
    background:#0d1b2a;
    color:white;
    position:fixed;
    width:250px;
}

.sidebar h4{
    padding:20px;
    text-align:center;
    background:#1b263b;
}

.sidebar a{
    display:block;
    color:white;
    padding:15px;
    text-decoration:none;
}

.sidebar a:hover{
    background:#ff6b00;
}

/* Topbar */
.topbar{
    margin-left:250px;
    background:#1b263b;
    color:white;
    padding:15px;
    font-size:22px;
    font-weight:bold;
}

/* Content */
.content{
    margin-left:250px;
    padding:30px;
}

/* Cards */
.card-box{
    padding:40px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    background:white;
    text-align:center;
}

.icon{
    font-size:50px;
    margin-bottom:15px;
}

</style>

</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h4>Alumni Panel</h4>

    <a href="#"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="#"><i class="fa fa-briefcase"></i> Post Job</a>
    <a href="#"><i class="fa fa-calendar"></i> View Events</a>
    <a href="#"><i class="fa fa-list"></i> Job Status</a>
    <a href="#"><i class="fa fa-users"></i> Alumni Directory</a>
</div>

<!-- Topbar -->
<div class="topbar">
    COLLEGE ALUMNI SYSTEM
</div>

<!-- Main Content -->
<div class="content">

    <h3 class="mb-4">Dashboard</h3>

    <div class="row">

        <div class="col-md-6">
            <div class="card-box">
                <div class="icon text-primary">
                    <i class="fa fa-calendar"></i>
                </div>
                <h2>5</h2>
                <p>Total Events</p>
                <button class="btn btn-primary">View Details</button>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card-box">
                <div class="icon text-danger">
                    <i class="fa fa-briefcase"></i>
                </div>
                <h2>1</h2>
                <p>Jobs Posted</p>
                <button class="btn btn-primary">View Details</button>
            </div>
        </div>

    </div>

</div>

</body>
</html>
